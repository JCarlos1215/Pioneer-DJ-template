<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
    user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <title>Pioneer DJ Pro Max - MIDI Edition</title>
        <style>
            :root { --bg: #0f0f0f; --panel: #222; --accent: #00ffcc; --text: #eee; --danger: #ff4444; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family:
    system-ui, -apple-system, sans-serif; overflow: hidden; height: 100vh; display: flex;
    flex-direction: column; user-select: none; -webkit-user-select: none; }
    header { height: 50px; background: #000; display: flex; align-items: center;
    justify-content: space-between; padding: 0 20px; font-size: 0.9rem; border-bottom: 2px solid
    var(--accent); z-index: 10; }
            .main { display: flex; flex: 1; padding: 15px; gap: 15px; height: calc(100vh - 130px); }
    .deck { width: 30%; background: var(--panel); border-radius: 15px; display: flex;
    flex-direction: column; align-items: center; justify-content: space-around; padding: 15px; border:
    1px solid #333; box-shadow: inset 0 0 15px #000; }
    .jog { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle,
    #333 30%, #000 100%); border: 6px solid #444; position: relative; transition: transform 0.1s linear;
    touch-action: none; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    .jog::after { content: ''; position: absolute; top: 5px; left: 50%; width: 4px; height:
    20px; background: var(--accent); transform: translateX(-50%); }
    .mixer { width: 40%; background: var(--panel); border-radius: 15px; display: flex;
    flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 0;
    border: 1px solid #333; }
            .faders { display: flex; gap: 30px; height: 180px; align-items: center; }
            .fader-box { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    input[type=range].dj-fader { -webkit-appearance: none; width: 150px; height: 10px;
    background: #111; border-radius: 5px; transform: rotate(-90deg); margin: 70px 0; }
    input[type=range].dj-fader::-webkit-slider-thumb { -webkit-appearance: none; height: 35px;
    width: 20px; background: #ccc; border: 1px solid #fff; border-radius: 3px; }
    .fx-bar { height: 80px; background: #050505; display: flex; justify-content: space-around;
    align-items: center; padding: 0 10px; border-top: 2px solid #333; }
    .fx-unit { background: #1a1a1a; padding: 8px 15px; border-radius: 6px; border: 1px solid
    #333; font-size: 0.7rem; text-align: center; cursor: pointer; }
    .fx-unit.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); color:
    var(--accent); }
    .btn { background: #444; color: white; border: none; padding: 12px 20px; border-radius: 8px;
    font-size: 0.8rem; font-weight: bold; cursor: pointer; margin: 5px; }
            .btn-play { background: var(--danger); }
            .btn-play.active { background: #ff8888; box-shadow: 0 0 15px var(--danger); }
            .load-btn { background: #0055ff; font-size: 0.6rem; padding: 5px 10px; }
            #midi-status { font-size: 0.7rem; color: #ff4444; }
            #midi-status.connected { color: var(--accent); }
    @media (max-width: 430px) { .main { flex-direction: column; overflow-y: auto; } .deck,
    .mixer { width: 100%; height: auto; margin-bottom: 15px; } .faders { height: 220px; } }
        </style>
    </head>
    <body>
        <header>
            <span>PIONEER DJ PRO MAX</span>
            <span id="midi-status">MIDI: Desconectado</span>
        </header>
        <div class="main">
            <!-- Deck A -->
            <div class="deck">
                <div style="font-size:0.7rem">DECK A</div>
                <input type="file" id="file-a" style="display:none" accept="audio/*">
    <button class="btn load-btn" onclick="document.getElementById('file-a').click()">CARGAR
    CANCIÓN</button>
                <div class="jog" id="jog-a"></div>
                <div>
                    <button class="btn btn-play" id="play-a">PLAY</button>
                    <button class="btn" id="cue-a">CUE</button>
                </div>
            </div>
            <!-- Mixer -->
            <div class="mixer">
                <div style="font-size:0.7rem">MIXER</div>
                <div class="faders">
                    <div class="fader-box">
    <input type="range" class="dj-fader" id="vol-a" min="0" max="1" step="0.01"
    value="0.8">
                        <span>CH A</span>
                    </div>
                    <div class="fader-box">
    <input type="range" class="dj-fader" id="vol-b" min="0" max="1" step="0.01"
    value="0.8">
                        <span>CH B</span>
                    </div>
                </div>
    <div style="display:flex; gap:10px"><button class="btn"
    onclick="beeps(200)">LOW</button><button class="btn" onclick="beeps(400)">MID</button><button
    class="btn" onclick="beeps(800)">HI</button></div>
            </div>
            <!-- Deck B -->
            <div class="deck">
                <div style="font-size:0.7rem">DECK B</div>
                <input type="file" id="file-b" style="display:none" accept="audio/*">
    <button class="btn load-btn" onclick="document.getElementById('file-b').click()">CARGAR
    CANCIÓN</button>
                <div class="jog" id="jog-b"></div>
                <div>
                    <button class="btn btn-play" id="play-b">PLAY</button>
                    <button class="btn" id="cue-b">CUE</button>
                </div>
            </div>
        </div>
        <div class="fx-bar">
            <div class="fx-unit" id="fx-1" onclick="toggleFX('fx-1')">REVERB<br>OFF</div>
            <div class="fx-unit" id="fx-2" onclick="toggleFX('fx-2')">ECHO<br>OFF</div>
            <div class="fx-unit" id="fx-3" onclick="toggleFX('fx-3')">FILTER<br>OFF</div>
        </div>
    
        <script>
            let audioCtx = null;
            const decks = {
                a: { source: null, buffer: null, gain: null, playing: false, element: 'play-a' },
                b: { source: null, buffer: null, gain: null, playing: false, element: 'play-b' }
            };
    
            function initAudio() {
                if (audioCtx) return;
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                decks.a.gain = audioCtx.createGain();
                decks.a.gain.connect(audioCtx.destination);
                decks.b.gain = audioCtx.createGain();
                decks.b.gain.connect(audioCtx.destination);
            }
    
            async function loadTrack(deckKey, file) {
                initAudio();
                const arrayBuffer = await file.arrayBuffer();
                decks[deckKey].buffer = await audioCtx.decodeAudioData(arrayBuffer);
                alert(`Canción cargada en Deck ${deckKey.toUpperCase()}`);
            }
    
            function togglePlay(deckKey) {
                initAudio();
                const d = decks[deckKey];
                if (!d.buffer) return alert("Carga una canción primero");
    
                if (d.playing) {
                    d.source.stop();
                    d.playing = false;
                    document.getElementById(d.element).classList.remove('active');
                } else {
                    d.source = audioCtx.createBufferSource();
                    d.source.buffer = d.buffer;
                    d.source.connect(d.gain);
                    d.source.start(0);
                    d.playing = true;
                    document.getElementById(d.element).classList.add('active');
                }
            }
    
            // EVENTOS DE ARCHIVOS
            document.getElementById('file-a').onchange = (e) => loadTrack('a', e.target.files[0]);
            document.getElementById('file-b').onchange = (e) => loadTrack('b', e.target.files[0]);
            document.getElementById('play-a').onclick = () => togglePlay('a');
            document.getElementById('play-b').onclick = () => togglePlay('b');
    
    document.getElementById('vol-a').oninput = (e) => { if(decks.a.gain) decks.a.gain.gain.value
    = e.target.value; };
    document.getElementById('vol-b').oninput = (e) => { if(decks.b.gain) decks.b.gain.gain.value
    = e.target.value; };
    
            // --- MOTOR MIDI (XDJ-RR) ---
            function initMIDI() {
                if (!navigator.requestMIDIAccess) {
    document.getElementById('midi-status').innerText = "MIDI: No soportado en este
    navegador";
                    return;
                }
                navigator.requestMIDIAccess().then(access => {
                    document.getElementById('midi-status').innerText = "MIDI: Buscando controlador...";
                    const inputs = access.inputs.values();
                    for (let input of inputs) {
                        document.getElementById('midi-status').innerText = "MIDI: XDJ-RR Conectado";
                        document.getElementById('midi-status').classList.add('connected');
                        input.onmidimessage = handleMIDIMessage;
                    }
                }).catch(err => {
                    document.getElementById('midi-status').innerText = "MIDI: Error de acceso";
                });
            }
    
            function handleMIDIMessage(message) {
                const [status, data1, data2] = message.data;
                // Mapeo simplificado para XDJ-RR (Ejemplos comunes de Pioneer)
                // Nota: Los códigos varían según la versión, pero estos son los estándares
                if (status === 144 || status === 176) { // Note On o Control Change
                    if (data1 === 60) togglePlay('a'); // Ejemplo: Botón Play A
                    if (data1 === 62) togglePlay('b'); // Ejemplo: Botón Play B
                    if (data1 === 1) { // Fader A
                        document.getElementById('vol-a').value = data2 / 127;
                        decks.a.gain.gain.value = data2 / 127;
                    }
                    if (data1 === 2) { // Fader B
                        document.getElementById('vol-b').value = data2 / 127;
                        decks.b.gain.gain.value = data2 / 127;
                    }
                }
            }
    
            function beeps(f) {
                initAudio();
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.value = f; g.gain.setValueAtTime(0.1, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                o.start(); o.stop(audioCtx.currentTime + 0.1);
            }
    
            function toggleFX(id) {
                const el = document.getElementById(id);
                el.classList.toggle('active');
    el.innerHTML = el.classList.contains('active') ? el.innerText.replace('OFF','ON') :
    el.innerText.replace('ON','OFF');
                beeps(600);
            }
    
            // Jogs interactivos
            function setupJog(id) {
                const el = document.getElementById(id);
                let sY=0, cR=0;
                el.addEventListener('touchstart', e => sY = e.touches[0].clientY);
                el.addEventListener('touchmove', e => {
                    const d = e.touches[0].clientY - sY;
                    cR += d * 0.5;
                    el.style.transform = `rotate(${cR}deg)`;
                    sY = e.touches[0].clientY;
                });
            }
            setupJog('jog-a'); setupJog('jog-b');
    
            window.onload = initMIDI;
        </script>
    </body>
    </html>
